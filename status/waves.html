<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Delivery portal | MIT-WPU</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --navy:#0b2f5c; --blue:#1663b0; --gold:#e8a13a; --ink:#16202e; --muted:#5a677e;
      --line:#dbe3ef; --paper:#fff; --surface:#f4f7fb; --page:#eef2f7;
      --done:#1c7a4a; --active:#1663b0; --planned:#c3ccd9; --blocked:#b23c3c; --input:#d99126;
    }
    @media (prefers-color-scheme: dark){
      :root{--ink:#e7edf6; --muted:#9fb0c6; --line:#26364b; --paper:#111c2a; --surface:#162334;
        --page:#0c1420; --done:#2f9e63; --active:#2f7fc4; --planned:#3a4c63; --blocked:#c05252; --input:#b8822f;}
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px}
    .shell{max-width:1120px;margin:0 auto;padding:0 clamp(16px,3vw,26px)}
    header.top{background:linear-gradient(120deg,var(--navy),var(--blue) 88%);color:#fff;
      padding:clamp(20px,4vw,32px) 0 clamp(18px,3vw,26px);border-bottom:3px solid var(--gold)}
    .eyebrow{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
    h1{font-size:clamp(1.4rem,3.2vw,1.9rem);margin-top:.35rem;font-weight:800;line-height:1.15}
    .sub{margin-top:.4rem;max-width:64ch;opacity:.9;font-size:.9rem}
    .kpis{display:flex;flex-wrap:wrap;gap:1.4rem;margin-top:1.1rem}
    .kpi b{display:block;font-size:1.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
    .kpi span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
    main{padding:clamp(18px,3vw,26px) 0 clamp(30px,5vw,46px);display:grid;gap:.9rem}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:.5rem;overflow:hidden}
    .panel > h2{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);font-weight:800;
      padding:.7rem .95rem;border-bottom:1px solid var(--line);background:var(--surface)}
    /* compact project panes */
    .projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.65rem;padding:.75rem}
    .proj{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.55rem;padding:.78rem;
      min-height:112px;border:1px solid var(--line);border-radius:.42rem;background:var(--surface)}
    .proj-name{font-weight:720;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .segbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--planned);min-width:80px}
    .segbar i{display:block;height:100%}
    .proj .segbar{grid-column:1/-1;height:7px;border-radius:99px}
    .proj-pct{font-weight:820;font-size:1.05rem;font-variant-numeric:tabular-nums;text-align:right}
    .proj-sub{grid-column:1/-1;font-size:.7rem;color:var(--muted);line-height:1.35}
    /* bottlenecks */
    .block{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .95rem;border-bottom:1px solid var(--line);font-size:.85rem}
    .block:last-child{border-bottom:0}
    .tag{flex:0 0 auto;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;
      padding:.16rem .45rem;border-radius:.2rem;margin-top:.12rem}
    .block-b{min-width:0}
    .block-b b{font-weight:680}
    .block-b p{color:var(--muted);font-size:.78rem}
    .who{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin-left:auto;flex:0 0 auto}
    .empty{padding:.7rem .95rem;color:var(--muted);font-size:.85rem}
    /* wave flow */
    .flow{display:flex;overflow-x:auto;gap:0;padding:.2rem}
    .step{flex:1 1 0;min-width:118px;padding:.6rem .7rem;border-right:1px solid var(--line);position:relative}
    .step:last-child{border-right:0}
    .step-n{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .step-t{font-size:.78rem;font-weight:650;line-height:1.25;margin:.15rem 0 .35rem;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .step .segbar{height:5px;border-radius:99px}
    .step-p{font-size:.68rem;color:var(--muted);margin-top:.25rem;font-variant-numeric:tabular-nums}
    .step.now{background:var(--surface)}
    .step.now .step-n{color:var(--blue)}
    /* remaining list */
    .rem{display:flex;align-items:center;gap:.5rem;padding:.34rem .95rem;font-size:.82rem;border-bottom:1px solid var(--line)}
    .rem:last-child{border-bottom:0}
    .dot{flex:0 0 auto;width:7px;height:7px;border-radius:99px}
    .rem-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rem-t a{color:inherit}
    .rem-w{color:var(--muted);font-size:.68rem;flex:0 0 auto}
    .s-done{background:var(--done)} .s-active{background:var(--active)} .s-planned{background:var(--planned)}
    .s-blocked{background:var(--blocked)} .s-input{background:var(--input)}
    footer.foot{border-top:1px solid var(--line);padding:.9rem 0 2rem;color:var(--muted);font-size:.78rem}
    .legend{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:.5rem}
    .legend span{display:flex;align-items:center;gap:.32rem}
    .legend i{width:9px;height:9px;border-radius:2px;display:block}
    @media (max-width:520px){.projects-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="shell">
    <p class="eyebrow">Delivery portal</p>
    <h1 data-title>MIT-WPU delivery portal</h1>
    <p class="sub" data-subtitle></p>
    <div class="kpis" data-kpis></div>
  </div></header>

  <main class="shell">
    <section class="panel"><h2>Projects</h2><div class="projects-grid" data-projects></div></section>
  </main>

  <footer class="foot"><div class="shell">
    <span data-meta>—</span>
  </div></footer>

  <script>
    (function () {
      var ORDER = ["done", "active", "input", "blocked", "planned"];
      function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
      function tally(items){var t={};ORDER.forEach(function(s){t[s]=0;});
        items.forEach(function(i){if(t[i.state]!==undefined)t[i.state]++;});return t;}
      function pct(items){return items.length?Math.round(items.filter(function(i){return i.state==="done";}).length/items.length*100):0;}
      function segbar(items){var t=tally(items),n=items.length||1;
        return '<span class="segbar">'+ORDER.map(function(s){
          return t[s]?'<i class="s-'+s+'" style="width:'+(t[s]/n*100)+'%"></i>':"";}).join("")+"</span>";}

      fetch("waves.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(render).catch(function(e){
          document.querySelector("[data-projects]").innerHTML='<p class="empty">Could not load the plan ('+esc(e.message)+").</p>";});

      function render(d){
        var states=d.states||{}, waves=d.waves||[], all=[];
        waves.forEach(function(w){(w.items||[]).forEach(function(i){all.push(Object.assign({wave:w.number,waveTitle:w.title},i));});});
        if(d.title){document.title=d.title+" | MIT-WPU";document.querySelector("[data-title]").textContent=d.title;}
        document.querySelector("[data-subtitle]").textContent="One compact status pane per project.";

        document.querySelector("[data-kpis]").innerHTML=
          '<div class="kpi"><b>'+pct(all)+'%</b><span>complete</span></div>';

        // ── projects: one segmented growth bar each
        var order=d.project_order||[], byProj={};
        all.forEach(function(i){var p=i.project||"Other";(byProj[p]=byProj[p]||[]).push(i);});
        var names=order.filter(function(p){return byProj[p];})
          .concat(Object.keys(byProj).filter(function(p){return order.indexOf(p)<0;}));
        document.querySelector("[data-projects]").innerHTML=names.map(function(p){
          var it=byProj[p], tt=tally(it), left=it.length-tt.done;
          var bits=[];
          if(tt.active) bits.push(tt.active+" in progress");
          if(tt.input) bits.push(tt.input+" needs input");
          if(tt.blocked) bits.push(tt.blocked+" blocked");
          if(tt.planned) bits.push(tt.planned+" planned");
          return '<article class="proj"><span class="proj-name">'+esc(p)+"</span>"+
            '<span class="proj-pct">'+pct(it)+"%</span>"+
            segbar(it)+'<span class="proj-sub">'+(left?esc(bits.join(" · "))+" · "+left+" of "+it.length+" left":"all "+it.length+" done")+"</span></article>";
        }).join("");

        document.querySelector("[data-meta]").textContent=
          "Updated "+(d.updated_at||"—");
      }
    })();
  </script>
</body>
</html>
